<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>games-next shot</title>
<style>
  html,body{margin:0;height:100%;background:#fff}
  iframe{border:0;width:1440px;height:900px}
</style>
    <link rel="stylesheet" href="/site-dark.css?v=20260902perf1" />
    <link rel="stylesheet" href="/site-mobile.css?v=20260902nav1" />
  </head><body>
<iframe id="f" src="http://127.0.0.1:8777/ko/games/#games-next-title"></iframe>
<script>
const f = document.getElementById('f');
f.onload = () => {
  try {
    const d = f.contentDocument;
    const w = f.contentWindow;
    // force reveal
    d.querySelectorAll('[data-games-reveal]').forEach(el => el.classList.add('is-in'));
    const t = d.getElementById('games-next-title');
    if (t) t.scrollIntoView({block:'center'});
    // mark ready
    document.title = 'READY';
  } catch(e) {
    document.title = 'ERR:'+e.message;
  }
};
</script>
</body></html>

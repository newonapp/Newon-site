        <section id="top" class="hero hero--ecosystem hero--vision hero--logo hero--entered reveal-on-scroll is-visible">
          <div class="hero-bg" aria-hidden="true"></div>
          <div class="container hero-inner hero-inner--vision">
            <div class="hero-copy hero-copy--vision">
              <p class="hero-eyebrow hero-eco-enter" style="--hero-enter-delay: 40ms">{{t:home.heroEyebrow}}</p>

              <div class="hero-brand-mark hero-eco-enter" style="--hero-enter-delay: 120ms">
                <picture class="hero-brand-mark__picture hero-brand-mark__picture--light">
                  <source type="image/webp" srcset="/newon-wordmark-chrome.webp" />
                  <img
                    class="hero-brand-mark__img hero-brand-mark__img--light"
                    src="/newon-wordmark-chrome.png"
                    alt="{{t:home.heroLogoAlt}}"
                    width="948"
                    height="361"
                    decoding="sync"
                    fetchpriority="high"
                  />
                </picture>
                <picture class="hero-brand-mark__picture hero-brand-mark__picture--dark">
                  <source type="image/webp" srcset="/newon-wordmark-chrome-dark.webp" />
                  <img
                    class="hero-brand-mark__img hero-brand-mark__img--dark"
                    src="/newon-wordmark-chrome-dark.png"
                    alt=""
                    width="948"
                    height="361"
                    decoding="async"
                    loading="lazy"
                  />
                </picture>
              </div>

              <h1 class="hero-title hero-eco-enter" style="--hero-enter-delay: 220ms">{{html:home.heroTitleHtml}}</h1>
              <p class="hero-sub hero-eco-enter" style="--hero-enter-delay: 300ms">{{t:home.heroSub}}</p>

              <div class="hero-actions hero-actions--vision hero-eco-enter" style="--hero-enter-delay: 380ms">
                <a
                  class="btn btn-primary hero-btn-primary"
                  href="#story-consumer"
                  aria-label="{{t:home.btnExploreBusinessAria}}"
                >{{t:home.btnExploreBusiness}}</a>
                <a
                  class="btn btn-ghost hero-btn-secondary"
                  href="/{{LANG_DIR}}/about/"
                  aria-label="{{t:home.btnLearnNewonAria}}"
                >{{t:home.btnLearnNewon}}</a>
              </div>
            </div>
          </div>
          <div class="hero-scroll hero-scroll--biz hero-eco-enter" style="--hero-enter-delay: 460ms" aria-hidden="true">
            <span class="hero-scroll__label">{{t:home.heroScrollLabel}}</span>
            <span class="hero-scroll__arrow">↓</span>
          </div>
        </section>

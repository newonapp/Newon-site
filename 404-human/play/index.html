<body>
  <div id="boot-loader" aria-live="polite">
    <strong>404: HUMAN</strong>
    <span>INITIALIZING HUMANITY PROTOCOL<br>LOADING MEMORY CORE</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('boot-loader');
      if (loader) loader.remove();
    });
    window.setTimeout(function () {
      var loader = document.getElementById('boot-loader');
      if (loader && document.querySelector('flutter-view, flt-glass-pane')) {
        loader.remove();
      }
    }, 45000);
  </script>

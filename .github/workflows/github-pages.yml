# GitHub Pages: serves the `gh-pages` branch (legacy).
# On main push: build `_publish/` and force-push it to `gh-pages`.

name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and assemble site
        run: node scripts/publish-site.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_publish
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          cname: www.newon.app

      - name: Verify production 404 HUMAN route
        run: node scripts/verify-production-404-human.mjs

      # Report-only: CDN propagation / transient network must not fail a successful deploy.
      - name: Post-deploy production smoke (report-only)
        if: always()
        continue-on-error: true
        run: |
          sleep 15
          node scripts/monitoring/check-production.mjs --smoke --report-only
        env:
          NEWON_SITE_ORIGIN: https://www.newon.app

      - name: Upload post-deploy smoke artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke-${{ github.run_id }}
          path: |
            reports/monitoring-latest.json
            reports/monitoring-latest.md
          if-no-files-found: ignore
          retention-days: 14
